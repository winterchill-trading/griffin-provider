name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: winterchill-trading/infra/.github/actions/ox-setup@main
        with:
          pins: |
            fixed-decimal https://github.com/winterchill-trading/fixed-decimal.git
            money https://github.com/winterchill-trading/money.git
            ledger https://github.com/winterchill-trading/ledger.git
            kyc-core https://github.com/winterchill-trading/kyc-core.git
            payments-core https://github.com/winterchill-trading/payments-core.git
            card-core https://github.com/winterchill-trading/card-core.git
            banking-provider https://github.com/winterchill-trading/banking-provider.git
            griffin-client https://github.com/winterchill-trading/griffin-client.git
      - run: opam exec -- dune build
      - run: opam exec -- dune build @examples/all
      - run: opam exec -- dune test
      - run: opam install -y result odoc
      # Warnings in this repository's files fail the step. A warning reported in a
      # dependency's file (a reference in an included signature that does not resolve
      # from here) is shown but belongs to that repository.
      - name: Build API docs (odoc warnings in this repository fail the step)
        run: |
          set -o pipefail
          opam exec -- dune build @doc --display short 2>&1 | tee doc.log
          if grep -A1 -E '^File "(lib|bin|examples|test)/' doc.log | grep -q "Warning"; then exit 1; fi
  obj-magic:
    uses: winterchill-trading/infra/.github/workflows/obj-magic.yml@main
